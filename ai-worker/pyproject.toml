[project]
name = "aiops-worker"
version = "0.1.0"
description = "AIOps AI reasoning plane: Temporal Python worker for Investigation RCA"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "temporalio>=1.7,<2",
    "pydantic>=2.6,<3",
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.39"]
# pydantic-ai provider(AIOPS_MODEL_PROVIDER=pydantic-ai)。与 anthropic 同为
# 可选依赖:mock provider 与全部离线测试都不需要它。
# 取 slim 而非完整包 —— 完整包带 pydantic-evals 与 pydantic-graph,而本项目已有
# 自己的评估服务(aiops_worker.evaluation)与 Temporal 编排,不需要那两层。
pydantic-ai = ["pydantic-ai-slim[anthropic]>=2.23,<3"]
# 可观测性(架构 §16):仅在设置了 AIOPS_OTLP_ENDPOINT 时才需要。
otel = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
    "temporalio[opentelemetry]>=1.7",
]
# 供评估服务(evaluation_runs)与 pgvector 语义 RAG(knowledge_items)访问数据库。
# 属可选依赖:mock embedding provider 与全部单元测试都无需真实数据库即可运行。
db = [
    "psycopg[binary]>=3.1,<4",
    "pgvector>=0.2,<1",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "psycopg[binary]>=3.1,<4",
    "pgvector>=0.2,<1",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
    "temporalio[opentelemetry]>=1.7",
    "anthropic>=0.39",
    # dev 里带上,否则 test_pydantic_ai_provider.py 会被 importorskip 跳过 ——
    # 而"跳过"和"通过"在 CI 输出里长得太像,那 12 个用例会静默失去保护。
    "pydantic-ai-slim[anthropic]>=2.23,<3",
]

[project.scripts]
aiops-worker = "aiops_worker.main:main"
aiops-evaluate = "aiops_worker.evaluation.run:main"
aiops-reindex = "aiops_worker.knowledge.reindex:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aiops_worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
