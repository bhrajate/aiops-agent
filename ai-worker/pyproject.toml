[project]
name = "aiops-worker"
version = "0.1.0"
description = "AIOps AI reasoning plane: Temporal Python worker for Investigation RCA"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "temporalio>=1.7,<2",
    "pydantic>=2.6,<3",
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.39"]
# 可观测性(架构 §16):仅在设置了 AIOPS_OTLP_ENDPOINT 时才需要。
otel = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
    "temporalio[opentelemetry]>=1.7",
]
# 供评估服务(evaluation_runs)与 pgvector 语义 RAG(knowledge_items)访问数据库。
# 属可选依赖:mock embedding provider 与全部单元测试都无需真实数据库即可运行。
db = [
    "psycopg[binary]>=3.1,<4",
    "pgvector>=0.2,<1",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "psycopg[binary]>=3.1,<4",
    "pgvector>=0.2,<1",
]

[project.scripts]
aiops-worker = "aiops_worker.main:main"
aiops-evaluate = "aiops_worker.evaluation.run:main"
aiops-reindex = "aiops_worker.knowledge.reindex:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aiops_worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
