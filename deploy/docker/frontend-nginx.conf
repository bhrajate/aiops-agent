# 镜像内置默认站点配置(K8s 部署时由 ConfigMap frontend-nginx 覆盖)。
# 默认后端指向集群内 control-plane Service;docker 直跑时可用环境覆盖或改挂载。
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ---- 安全响应头(全站生效)----
  # CSP:默认仅允许自身;connect-src 额外放行 API/SSE 同源请求(反代在同源 /v1/)。
  #      如需接入独立 API 网关或错误上报域名,在 connect-src 追加对应来源。
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # HSTS:仅在由上游(Ingress/LB)完成 TLS 终止的 HTTPS 场景下才有意义。
  #       纯 HTTP 暴露时浏览器会忽略;启用前请确认全站 HTTPS。
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok";
  }

  location /v1/ {
    proxy_pass http://control-plane.aiops.svc.cluster.local:8088;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    chunked_transfer_encoding off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
