apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aiops.labels" . | nindent 4 }}
data:
  # 运行环境:生产护栏的总开关。production/prod 才会执行 control-plane 的严格
  # 启动校验,并让 cluster-agent 拒绝以 mock 数据源启动。缺失时代码默认
  # development —— 所有护栏静默放行,配错不再 fail-fast。
  AIOPS_ENV: {{ .Values.config.env | quote }}
  # cluster-agent 的 K8s 只读数据源。代码默认 mock(会产出虚构但自洽的假证据),
  # 因此必须显式给出;env=production 下 mock 会被拒绝启动。
  AIOPS_DATASOURCE: {{ .Values.config.datasource | quote }}
  AIOPS_PUBLIC_ADDR: {{ .Values.config.publicAddr | quote }}
  AIOPS_INTERNAL_ADDR: {{ .Values.config.internalAddr | quote }}
  AIOPS_CLUSTER_AGENT_ADDR: {{ .Values.config.clusterAgentAddr | quote }}
  AIOPS_KAFKA_BROKERS: {{ .Values.config.kafkaBrokers | quote }}
  AIOPS_TEMPORAL_HOSTPORT: {{ .Values.config.temporalHostPort | quote }}
  AIOPS_TEMPORAL_NAMESPACE: {{ .Values.config.temporalNamespace | quote }}
  AIOPS_TEMPORAL_QUEUE: {{ .Values.config.temporalQueue | quote }}
  AIOPS_TASK_QUEUE: {{ .Values.config.temporalQueue | quote }}
  # 单个 Workflow run 的墙钟硬上限。不是调查时长上限(那由 Budget 管),而是
  # 异常挂死的 run 的回收兜底。下限 60h:Worker 最长等待人工反馈 48h,配小了
  # 控制面会拒绝启动而不是静默截断。
  AIOPS_TEMPORAL_RUN_TIMEOUT_SEC: {{ .Values.config.temporalRunTimeoutSec | quote }}
  AIOPS_MAX_CONCURRENT_ACTIVITIES: {{ .Values.config.maxConcurrentActivities | quote }}
  AIOPS_S3_ENDPOINT: {{ .Values.config.s3Endpoint | quote }}
  AIOPS_S3_BUCKET: {{ .Values.config.s3Bucket | quote }}
  AIOPS_CLUSTER_AGENT_URL: {{ include "aiops.clusterAgentUrl" . | quote }}
  AIOPS_CONTROL_INTERNAL_URL: {{ include "aiops.controlInternalUrl" . | quote }}
  AIOPS_CLUSTER_ID: {{ .Values.config.clusterId | quote }}
  # 共享观测后端(控制面直连)。生产必须至少配一个,否则启动校验拒绝
  # ——未配置会回退 mock,产出确定性假证据。
  AIOPS_PROM_URL: {{ .Values.config.prometheusUrl | quote }}
  AIOPS_LOKI_URL: {{ .Values.config.lokiUrl | quote }}
  AIOPS_TEMPO_URL: {{ .Values.config.tempoUrl | quote }}
  # 集群维度 label 名,**按后端分别配置**:三者命名法不同,且点号在 PromQL/LogQL
  # 里是语法错误,单一值无法同时满足(详见 values.yaml 注释与 docs/INTEGRATION.md)。
  AIOPS_CLUSTER_LABEL: {{ .Values.config.clusterLabel | quote }}
  AIOPS_PROM_CLUSTER_LABEL: {{ .Values.config.promClusterLabel | quote }}
  AIOPS_LOKI_CLUSTER_LABEL: {{ .Values.config.lokiClusterLabel | quote }}
  AIOPS_TEMPO_CLUSTER_LABEL: {{ .Values.config.tempoClusterLabel | quote }}
  AIOPS_CLUSTER_LABEL_DISABLED: {{ .Values.config.clusterLabelDisabled | quote }}
  AIOPS_TENANT: {{ .Values.config.tenant | quote }}
  AIOPS_AUTH_MODE: {{ .Values.config.authMode | quote }}
  AIOPS_OIDC_AUDIENCE: {{ .Values.config.oidcAudience | quote }}
  AIOPS_MODEL_PROVIDER: {{ .Values.config.modelProvider | quote }}
  AIOPS_ANTHROPIC_MODEL: {{ .Values.config.anthropicModel | quote }}
  AIOPS_MAX_DELIVERY_ATTEMPTS: {{ .Values.config.maxDeliveryAttempts | quote }}
  # 自动触发策略(F7)。被跳过的 incident 仍入库、仍可人工发起调查,并写审计+指标。
  # 调阈值前先看 sum by (reason) (aiops_trigger_decisions_total)。
  AIOPS_AUTO_TRIGGER_ALL: {{ .Values.config.autoTrigger.all | quote }}
  AIOPS_AUTO_TRIGGER_ALWAYS_SEVERITIES: {{ .Values.config.autoTrigger.alwaysSeverities | quote }}
  AIOPS_AUTO_TRIGGER_SKIP_SEVERITIES: {{ .Values.config.autoTrigger.skipSeverities | quote }}
  AIOPS_AUTO_TRIGGER_BURST_SIGNALS: {{ .Values.config.autoTrigger.burstSignals | quote }}
  AIOPS_AUTO_TRIGGER_ON_CHANGE: {{ .Values.config.autoTrigger.onChange | quote }}
  # 服务依赖拓扑(需 Tempo 启用 metrics-generator 的 service-graphs)
  AIOPS_TOPOLOGY_ENABLED: {{ .Values.config.topology.enabled | quote }}
  AIOPS_TOPOLOGY_SYNC_SEC: {{ .Values.config.topology.syncSec | quote }}
  AIOPS_TOPOLOGY_MAX_EDGE_AGE_SEC: {{ .Values.config.topology.maxEdgeAgeSec | quote }}
  AIOPS_TOPOLOGY_MIN_CONFIDENCE: {{ .Values.config.topology.minConfidence | quote }}
  AIOPS_TOPOLOGY_MIN_LINK_CONFIDENCE: {{ .Values.config.topology.minLinkConfidence | quote }}
  AIOPS_RETENTION_TOPOLOGY_DAYS: {{ .Values.config.topology.retentionDays | quote }}
  # SLO 燃尽率监视(主动异常检测)。SLI 定义由 ConfigMap 挂载成文件。
  AIOPS_SLO_ENABLED: {{ .Values.config.slo.enabled | quote }}
  AIOPS_SLO_INTERVAL_SEC: {{ .Values.config.slo.intervalSec | quote }}
  {{- if .Values.config.slo.definitions }}
  AIOPS_SLO_DEFINITIONS_PATH: {{ printf "%s/slis.json" .Values.config.slo.mountPath | quote }}
  {{- end }}
{{- if .Values.mtls.enabled }}
  AIOPS_AGENT_TLS_ENABLED: "true"
  AIOPS_AGENT_TLS_CERT: {{ printf "%s/agent.crt" .Values.mtls.mountPath | quote }}
  AIOPS_AGENT_TLS_KEY: {{ printf "%s/agent.key" .Values.mtls.mountPath | quote }}
  AIOPS_AGENT_TLS_CLIENT_CA: {{ printf "%s/ca.crt" .Values.mtls.mountPath | quote }}
  AIOPS_AGENT_MTLS_ENABLED: "true"
  AIOPS_AGENT_CLIENT_CERT: {{ printf "%s/client.crt" .Values.mtls.mountPath | quote }}
  AIOPS_AGENT_CLIENT_KEY: {{ printf "%s/client.key" .Values.mtls.mountPath | quote }}
  AIOPS_AGENT_CA: {{ printf "%s/ca.crt" .Values.mtls.mountPath | quote }}
{{- else }}
  AIOPS_AGENT_TLS_ENABLED: "false"
  AIOPS_AGENT_MTLS_ENABLED: "false"
{{- end }}
