apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: cluster-agent
    app.kubernetes.io/component: cluster-agent
    {{- include "aiops.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.clusterAgent.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: cluster-agent
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cluster-agent
        app.kubernetes.io/component: cluster-agent
        app.kubernetes.io/part-of: aiops
    spec:
      serviceAccountName: cluster-agent
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- include "aiops.antiAffinity" (list "cluster-agent" .) | nindent 6 }}
      containers:
        - name: cluster-agent
          image: {{ include "aiops.image" (list .Values.clusterAgent . "cluster-agent") | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: tools
              containerPort: 9100
            - name: health
              containerPort: 9101
          envFrom:
            - configMapRef:
                name: aiops-config
            - secretRef:
                name: {{ include "aiops.secretName" . }}
          # 探针走独立明文 health 端口:mTLS 开启时 kubelet 无客户端证书,
          # 对 tools 端口做 HTTPS 探针会握手失败。health 端口只暴露 /healthz。
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.clusterAgent.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- if .Values.mtls.enabled }}
          volumeMounts:
            - name: agent-tls
              mountPath: {{ .Values.mtls.mountPath }}
              readOnly: true
          {{- end }}
      {{- if .Values.mtls.enabled }}
      volumes:
        - name: agent-tls
          secret:
            secretName: {{ .Values.mtls.agentSecret }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: cluster-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: cluster-agent
    {{- include "aiops.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cluster-agent
  ports:
    - name: tools
      port: 9100
      targetPort: tools
