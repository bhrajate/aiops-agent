{{- if .Values.secrets.create }}
# 仅在 secrets.create=true 时渲染(演示/自管)。生产建议 create=false + 外部 Secret 注入。
apiVersion: v1
kind: Secret
metadata:
  name: aiops-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aiops.labels" . | nindent 4 }}
type: Opaque
stringData:
  AIOPS_DB_DSN: {{ .Values.secrets.data.dbDsn | quote }}
  AIOPS_INTERNAL_TOKEN: {{ .Values.secrets.data.internalToken | quote }}
  AIOPS_WEBHOOK_SECRET: {{ .Values.secrets.data.webhookSecret | quote }}
  AIOPS_AUTH_HS256_SECRET: {{ .Values.secrets.data.authHs256Secret | quote }}
  AIOPS_OIDC_ISSUER: {{ .Values.secrets.data.oidcIssuer | quote }}
  AIOPS_OIDC_JWKS_URL: {{ .Values.secrets.data.oidcJwksUrl | quote }}
  AIOPS_S3_ACCESS_KEY: {{ .Values.secrets.data.s3AccessKey | quote }}
  AIOPS_S3_SECRET_KEY: {{ .Values.secrets.data.s3SecretKey | quote }}
  AIOPS_ANTHROPIC_API_KEY: {{ .Values.secrets.data.anthropicApiKey | quote }}
{{- end }}
