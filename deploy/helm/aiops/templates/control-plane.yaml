apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: control-plane
    app.kubernetes.io/component: control-plane
    {{- include "aiops.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controlPlane.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-plane
        app.kubernetes.io/component: control-plane
        app.kubernetes.io/part-of: aiops
    spec:
      serviceAccountName: control-plane
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- include "aiops.antiAffinity" (list "control-plane" .) | nindent 6 }}
      containers:
        - name: control-plane
          image: {{ include "aiops.image" (list .Values.controlPlane . "control-plane") | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: public
              containerPort: 8088
            - name: internal
              containerPort: 8090
          envFrom:
            - configMapRef:
                name: aiops-config
            - secretRef:
                name: {{ include "aiops.secretName" . }}
          {{- if .Values.controlPlane.splitRoles }}
          # 拆分模式:本副本只提供 API,不消费 Kafka、不投递 outbox
          env:
            - name: AIOPS_ROLES
              value: "api,internal"
          {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: public
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: public
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- if .Values.mtls.enabled }}
          volumeMounts:
            - name: client-tls
              mountPath: {{ .Values.mtls.mountPath }}
              readOnly: true
          {{- end }}
      {{- if .Values.mtls.enabled }}
      volumes:
        - name: client-tls
          secret:
            secretName: {{ .Values.mtls.clientSecret }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: control-plane
    {{- include "aiops.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: control-plane
  ports:
    - name: public
      port: 8088
      targetPort: public
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane-internal
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: control-plane
    app.kubernetes.io/component: internal-api
    {{- include "aiops.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: control-plane
  ports:
    - name: internal
      port: 8090
      targetPort: internal
