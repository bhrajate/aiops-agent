# 生产覆盖:多副本、OIDC、anthropic、mTLS 必开、NetworkPolicy 开、
# 敏感项由外部 Secret 注入(此处 secrets.create=false,用 existingSecret)。
global:
  imageRegistry: ghcr.io/aiops
  imageTag: "v0.1.0"          # 固定 tag,禁用 latest
  imagePullSecrets:
    - name: ghcr-pull

config:
  # 显式声明(与基线同值):生产护栏总开关。少了它,下面这一整套配置就没有任何
  # 东西在启动时兜底 —— 漏配 webhook secret、错填后端 URL 都会静默跑起来。
  env: "production"
  # 真实 K8s 只读数据源(client-go)。mock 在 env=production 下会被拒绝启动。
  datasource: "live"
  clusterId: "prod-cn-1"
  authMode: "oidc"
  modelProvider: "anthropic"
  anthropicModel: "claude-opus-4-8[1M]"
  kafkaBrokers: "kafka-bootstrap.data.svc.cluster.local:9092"
  temporalHostPort: "temporal-frontend.temporal.svc.cluster.local:7233"
  s3Endpoint: "https://s3.cn-north-1.amazonaws.com.cn"
  s3Bucket: "aiops-evidence-prod"
  # 共享观测后端:生产必须配,否则启动校验拒绝(未配置会回退 mock 假证据)。
  prometheusUrl: "http://prometheus.monitoring.svc.cluster.local:9090"
  lokiUrl: "http://loki-gateway.monitoring.svc.cluster.local:80"
  tempoUrl: "http://tempo-query-frontend.monitoring.svc.cluster.local:3200"
  # ⚠ 这三个值**必须**对着你们真实后端核对,示例值大概率不对:
  #   Prom  : curl -s <prom>/api/v1/labels | grep -o 'cluster[a-z_]*'
  #   Loki  : curl -s <loki>/loki/api/v1/labels | grep -o 'cluster[a-z_]*'
  #   Tempo : 查一条 trace 的 resource attributes,看集群字段实际叫什么
  # 名字写错不报错、只静默查空;点号给了 Prom/Loki 则启动即失败。
  promClusterLabel: "cluster"
  lokiClusterLabel: "cluster"
  tempoClusterLabel: "k8s.cluster.name"

# 生产:不在 values 落明文,改用 External Secrets Operator / Vault 生成的同名 Secret。
secrets:
  create: false
  existingSecret: "aiops-secrets"

mtls:
  enabled: true
  agentSecret: "aiops-agent-tls"
  clientSecret: "aiops-client-tls"

controlPlane:
  replicas: 3
  resources:
    requests: { cpu: "250m", memory: "256Mi" }
    limits: { cpu: "2", memory: "1Gi" }
aiWorker:
  replicas: 3
  resources:
    requests: { cpu: "250m", memory: "512Mi" }
    limits: { cpu: "2", memory: "2Gi" }
clusterAgent:
  replicas: 2
frontend:
  replicas: 3

ingress:
  enabled: true
  className: "nginx"
  host: "aiops.corp.example"
  tls:
    enabled: true
    secretName: "aiops-public-tls"

networkPolicy:
  enabled: true

podAntiAffinity: true
topologySpread: true
