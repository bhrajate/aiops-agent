# =============================================================================
# AIOps Agent Helm chart 默认值(生产基线)。
# 用 values-dev.yaml / values-prod.yaml 覆盖切换环境。
# =============================================================================

# 全局镜像仓库前缀与统一 tag(各组件可单独覆盖 image.tag)。
global:
  imageRegistry: ghcr.io/aiops
  # ⚠️ 禁用 latest:用固定版本 tag(不可复现/无法回滚)。dev 覆盖为 "dev"。
  imageTag: v0.1.0
  imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# ---- 集群级资源(ClusterRole/Binding)开关 ----
rbac:
  # cluster-agent 只读 ClusterRole(安全核心)。多集群共享 chart 时仅装一次可关此项。
  create: true

# ---- 非敏感配置(渲染进 ConfigMap aiops-config)----
config:
  clusterId: "prod-cn-1"

  # ---- 共享观测后端(控制面直连 Prometheus/Loki/Tempo)----
  # 生产必须至少配一个:未配置会回退 mock 数据源,产出确定性假证据,
  # 而 RCA 会基于虚构数据给出"有证据支撑"的结论。启动校验会拒绝这种配置。
  prometheusUrl: ""
  lokiUrl: ""
  tempoUrl: ""

  # ---- 集群维度 label 名(按后端分别配置)----
  # 三个后端对"集群"的命名法互不兼容:
  #   Prometheus/Mimir : cluster            external_labels 注入
  #   Loki (Alloy)     : cluster            relabel 注入
  #   Loki (OTLP 原生) : k8s_cluster_name   LogQL label 名须符合 Prom 命名法,点号转下划线
  #   Tempo            : k8s.cluster.name   OTel 语义约定,原生保留点号
  # 点号在 PromQL/LogQL 里是**语法错误**,所以单一值无法同时满足三者
  # (配 cluster → Tempo 静默查空;配 k8s.cluster.name → Prom/Loki 每次查询语法错)。
  #
  # clusterLabel 是全局回落值;下面三个按需覆盖。留空则用各后端内置默认值。
  #
  # ⚠ 上线前必须对着真实后端核对(核对命令见 docs/INTEGRATION.md):名字写错
  #   不会报错,只会**静默查不到数据**。语法非法(如点号给了 Prom)则启动即失败。
  clusterLabel: ""
  promClusterLabel: "cluster"
  lokiClusterLabel: "cluster"
  tempoClusterLabel: "k8s.cluster.name"
  # 仅当观测后端确为**本集群专用**时才设 true。多集群共享后端下设 true
  # 会让 RCA 读到其他集群的同名 namespace,且该错误在诊断结论里看不出来。
  clusterLabelDisabled: false

  # ---- 自动触发策略(F7)----
  # 此前一律触发:每个 incident 都烧一次分诊模型调用,含 P4 单信号。
  # 被跳过的仍入库、仍在前端可见、仍可人工发起调查,且写 trigger_skipped 审计
  # 与 aiops_trigger_decisions_total 指标(按 reason 分维度)。
  # 调阈值前先看:sum by (reason) (aiops_trigger_decisions_total)
  autoTrigger:
    all: false                      # true 完整回到旧行为
    alwaysSeverities: "P1,P2"
    # 默认只含 P4:P3 是最常见级别、混着不少真问题,拦它会显著改变值班预期。
    skipSeverities: "P4"
    burstSignals: 3                 # 0 关闭该判据
    onChange: true                  # 变更关联必触发
  tenant: "default"
  publicAddr: ":8088"
  internalAddr: ":8090"
  clusterAgentAddr: ":9100"
  kafkaBrokers: "kafka-bootstrap.data.svc.cluster.local:9092"
  temporalHostPort: "temporal-frontend.temporal.svc.cluster.local:7233"
  temporalNamespace: "default"
  temporalQueue: "investigation-ai"
  s3Endpoint: "http://minio.data.svc.cluster.local:9000"
  s3Bucket: "aiops-evidence"
  authMode: "oidc"                 # hs256 | oidc | disabled
  oidcAudience: "aiops"
  modelProvider: "anthropic"       # mock | anthropic
  anthropicModel: "claude-opus-4-8[1M]"
  maxDeliveryAttempts: "5"
  # 组件互联(默认按 release 命名的集群内 DNS,模板会补全)。
  clusterAgentUrlOverride: ""      # 留空则模板按 mTLS 开关自动生成 http/https URL
  controlInternalUrlOverride: ""

# ---- 敏感配置 ----
# 生产强烈建议由 External Secrets / Vault 注入同名 Secret,chart 不渲染明文。
# 默认 create=false(fail-safe):避免误将下方 CHANGE_ME 明文渲染进生产集群。
# dev(values-dev.yaml)显式开启 create=true 注入本地弱口令;
# 自管/演示需直接注入时,显式设 create=true 并覆盖 data 下的占位值。
secrets:
  create: false
  # create=false 时,需事先用其它方式创建同名 Secret;此处填其名字(默认 aiops-secrets)。
  existingSecret: "aiops-secrets"
  data:
    dbDsn: "postgres://aiops:CHANGE_ME@postgres.data.svc.cluster.local:5432/aiops?sslmode=require"
    internalToken: "CHANGE_ME_internal_token"
    webhookSecret: "CHANGE_ME_webhook_secret"
    authHs256Secret: ""
    oidcIssuer: "https://idp.corp.example/realms/aiops"
    oidcJwksUrl: "https://idp.corp.example/realms/aiops/protocol/openid-connect/certs"
    s3AccessKey: "CHANGE_ME"
    s3SecretKey: "CHANGE_ME"
    anthropicApiKey: ""

# ---- mTLS(Tool Gateway ↔ cluster-agent)----
mtls:
  enabled: true
  # 证书 Secret(由 deploy/certs/gen-certs.sh 生成后 kubectl create;或 cert-manager 签发)。
  agentSecret: "aiops-agent-tls"    # ca.crt / agent.crt / agent.key
  clientSecret: "aiops-client-tls"  # ca.crt / client.crt / client.key
  mountPath: "/certs"

# ---- 各组件 ----
controlPlane:
  replicas: 2
  image:
    repository: ""     # 留空 → {global.imageRegistry}/control-plane
    tag: ""            # 留空 → global.imageTag
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "1", memory: "512Mi" }
  # 按角色拆分部署(物理平面分离):
  #   false → 单体,一个 Deployment 跑所有角色(默认,向后兼容)
  #   true  → API 副本(api,internal)与后台管道副本(ingest,trigger,outbox)分开,
  #           可独立扩缩;后台 panic 不影响 API 可用性
  splitRoles: false
  worker:               # splitRoles=true 时的后台管道副本
    replicas: 2
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "1", memory: "512Mi" }

aiWorker:
  replicas: 2
  image:
    repository: ""
    tag: ""
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "2", memory: "1Gi" }

clusterAgent:
  replicas: 2
  image:
    repository: ""
    tag: ""
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits: { cpu: "500m", memory: "256Mi" }

frontend:
  replicas: 2
  image:
    repository: ""
    tag: ""
  resources:
    requests: { cpu: "20m", memory: "32Mi" }
    limits: { cpu: "200m", memory: "128Mi" }

# ---- 公共 API + 前端入口 ----
ingress:
  enabled: true
  className: "nginx"
  host: "aiops.example.com"
  ingressControllerNamespace: "ingress-nginx"   # 供 NetworkPolicy 放行
  tls:
    enabled: true
    secretName: "aiops-public-tls"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

# ---- 网络策略 ----
networkPolicy:
  enabled: true
  # Egress 白名单依赖的外部命名空间名与端口(按实际基础设施部署调整)。
  egress:
    # 基础设施所在命名空间(通过 kubernetes.io/metadata.name 选择)。
    dnsNamespace: "kube-system"      # CoreDNS/kube-dns
    dataNamespace: "data"            # PostgreSQL / Kafka / MinIO
    temporalNamespace: "temporal"    # Temporal frontend
    monitoringNamespace: "monitoring" # Prometheus / Loki / Tempo
    # 端口(与 config 中地址保持一致)。
    postgresPort: 5432
    kafkaPort: 9092
    minioPort: 9000
    temporalPort: 7233
    clusterAgentPort: 9100
    controlInternalPort: 8090
    controlPublicPort: 8088
    # 外部模型 API / 外部 S3 出站端口(HTTPS)。ai-worker 需要访问外部模型服务。
    externalHttpsPort: 443
    # 可观测后端端口(cluster-agent 采集)。
    prometheusPort: 9090
    lokiPort: 3100
    tempoHttpPort: 3200
    tempoOtlpPort: 4317

# ---- 通用调度约束 ----
podAntiAffinity: true          # 副本跨节点(preferred)
topologySpread: true

# ---- 指标采集与告警(P5)----
# 此前 deploy/ 下既无 PrometheusRule 也无 ServiceMonitor:指标存在但没人抓、
# 没人告警。二者都需要集群里装了 Prometheus Operator(CRD 存在)才能应用。
monitoring:
  serviceMonitor:
    enabled: false
    # Prometheus Operator 靠这个 label 发现 ServiceMonitor,取值随你们的
    # Prometheus 实例配置(常见 release: kube-prometheus-stack)。
    labels: {}
    # 30s 而非 15s:队列深度指标在抓取时查库,抓太频繁会给业务库添负载。
    interval: 30s
  prometheusRule:
    enabled: false
    labels: {}
  thresholds:
    # outbox 最老待投递年龄超过此值(秒)判为投递卡住。
    # 600s 的取法:正常投递是亚秒级,10 分钟意味着确实不动了;
    # 同时留足风暴排空的余量,避免误报。
    outboxStuckSeconds: 600
    # 死信存量超过此值告警。取 0 会让单条偶发失败就吵醒值班,
    # 而死信本就是"需要人看但不紧急"的性质。
    deadLetterBacklog: 10
    # ---- 成本(F10)----
    # 模型花费速率上限(USD/小时)。**这三个值必须按你们的实际规模与预算调整**,
    # 这里的数字只是让规则可用的占位:
    #   costUSDPerHour 按"每小时几十次调查、每次几分钱"的量级估;
    #   costUSDPerInvestigation 取 Budget 默认 max_cost_usd(2)的一半 ——
    #     P99 打到预算一半通常已意味着 RCA 循环收不住;
    #   ungroundedPerHour 取 5:偶发降级是正常的(证据确实不足),
    #     持续偏高才是模型或 prompt 退化。
    costUSDPerHour: 5
    costUSDPerInvestigation: 1
    ungroundedPerHour: 5
