# nginx 站点配置:静态托管 + SPA 回退 + /v1 反代到 control-plane(SSE 关闭缓冲)。
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx
  namespace: aiops
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: aiops
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      # ---- 安全响应头(全站生效)----
      # CSP:默认仅允许自身;connect-src 放行同源 API/SSE(反代在同源 /v1/)。
      #      接入独立网关/错误上报域名时,在 connect-src 追加来源。
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      # HSTS:由 Ingress 完成 TLS 终止的 HTTPS 场景才生效(纯 HTTP 下浏览器忽略)。
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

      # 本地健康检查(不依赖后端)。
      location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
      }

      # 公共 API + SSE 反代到 control-plane。
      location /v1/ {
        proxy_pass http://control-plane.aiops.svc.cluster.local:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE:关闭缓冲,保持长连接。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
      }

      # SPA 路由回退。
      location / {
        try_files $uri $uri/ /index.html;
      }
    }
