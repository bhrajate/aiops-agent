# nginx 站点配置:静态托管 + SPA 回退 + /v1 反代到 control-plane(SSE 关闭缓冲)。
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx
  namespace: aiops
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: aiops
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      # 本地健康检查(不依赖后端)。
      location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
      }

      # 公共 API + SSE 反代到 control-plane。
      location /v1/ {
        proxy_pass http://control-plane.aiops.svc.cluster.local:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE:关闭缓冲,保持长连接。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
      }

      # SPA 路由回退。
      location / {
        try_files $uri $uri/ /index.html;
      }
    }
