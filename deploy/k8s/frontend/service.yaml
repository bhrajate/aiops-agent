apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: aiops
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: aiops
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  namespace: aiops
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: aiops
automountServiceAccountToken: false
