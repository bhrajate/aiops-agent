# AI Worker 的 ServiceAccount。Worker 不访问 Kubernetes API(所有集群数据经
# Tool Gateway → cluster-agent 获取),故不绑定任何 RBAC。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-worker
  namespace: aiops
  labels:
    app.kubernetes.io/name: ai-worker
    app.kubernetes.io/part-of: aiops
automountServiceAccountToken: false
