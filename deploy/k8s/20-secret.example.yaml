# Secret 模板 —— 切勿把真实值提交到仓库。
# 生产建议由 Vault / External Secrets Operator / KMS 注入(架构文档 §19 凭据管理);
# 此文件仅作字段说明与本地 apply 占位。用法见 deploy/DEPLOY.md。
#
# 生成示例(命令式,避免明文入库):
#   kubectl -n aiops create secret generic aiops-secrets \
#     --from-literal=AIOPS_DB_DSN='postgres://aiops:***@pg-host:5432/aiops?sslmode=require' \
#     --from-literal=AIOPS_INTERNAL_TOKEN='...' \
#     --from-literal=AIOPS_WEBHOOK_SECRET='...' \
#     --from-literal=AIOPS_AUTH_HS256_SECRET='...' \
#     --from-literal=AIOPS_S3_ACCESS_KEY='...' \
#     --from-literal=AIOPS_S3_SECRET_KEY='...' \
#     --from-literal=AIOPS_ANTHROPIC_API_KEY='...'
#
# mTLS 证书用独立 Secret(由 deploy/certs/gen-certs.sh 生成,见 30-mtls-secret 说明):
#   kubectl -n aiops create secret generic aiops-agent-tls \
#     --from-file=ca.crt --from-file=agent.crt --from-file=agent.key
#   kubectl -n aiops create secret generic aiops-client-tls \
#     --from-file=ca.crt --from-file=client.crt --from-file=client.key
apiVersion: v1
kind: Secret
metadata:
  name: aiops-secrets
  namespace: aiops
  labels:
    app.kubernetes.io/part-of: aiops
type: Opaque
stringData:
  # 业务库(唯一 DB 写入方为 control-plane;生产 sslmode=require)
  AIOPS_DB_DSN: "postgres://aiops:CHANGE_ME@postgres.data.svc.cluster.local:5432/aiops?sslmode=require"
  # 内部 API 共享密钥(X-Internal-Token;仅集群内)
  AIOPS_INTERNAL_TOKEN: "CHANGE_ME_internal_token"
  # Webhook HMAC(POST /v1/signals 签名校验)
  AIOPS_WEBHOOK_SECRET: "CHANGE_ME_webhook_secret"
  # 开发签发密钥(生产 OIDC 模式可留空)
  AIOPS_AUTH_HS256_SECRET: ""
  # OIDC(生产)
  AIOPS_OIDC_ISSUER: "https://idp.corp.example/realms/aiops"
  AIOPS_OIDC_JWKS_URL: "https://idp.corp.example/realms/aiops/protocol/openid-connect/certs"
  # 对象存储凭据
  AIOPS_S3_ACCESS_KEY: "CHANGE_ME"
  AIOPS_S3_SECRET_KEY: "CHANGE_ME"
  # 模型密钥(provider=anthropic 时必填)
  AIOPS_ANTHROPIC_API_KEY: ""
