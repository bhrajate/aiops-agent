# Control Plane 的 ServiceAccount。控制面自身不需要访问 Kubernetes API,
# 因此不绑定任何 Role/ClusterRole(最小权限)。仅用于挂载身份与 NetworkPolicy 定位。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-plane
  namespace: aiops
  labels:
    app.kubernetes.io/name: control-plane
    app.kubernetes.io/part-of: aiops
automountServiceAccountToken: false
