# Control Plane:公共 API(:8088)+ 内部 API(:8090)+ Incident Manager + Tool Gateway。
# 唯一 DB 写入方。多副本跨节点;作为 mTLS 客户端调用 cluster-agent。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: aiops
  labels:
    app.kubernetes.io/name: control-plane
    app.kubernetes.io/part-of: aiops
    app.kubernetes.io/component: control-plane
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-plane
        app.kubernetes.io/part-of: aiops
        app.kubernetes.io/component: control-plane
    spec:
      serviceAccountName: control-plane
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # 跨节点反亲和:同一 Deployment 的副本尽量分散到不同节点。
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: control-plane
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: control-plane
      # 优雅终止:公共 API 有长连接 SSE(心跳/时间线),滚动更新/缩容时给足排空时间;
      # preStop 先摘流量再等在途请求收尾(配合 server graceful shutdown)。
      terminationGracePeriodSeconds: 45
      containers:
        - name: control-plane
          # ⚠️ 占位版本 tag,禁用 :latest(不可复现、无法回滚)。发布时替换为实际版本或 digest。
          image: ghcr.io/aiops/control-plane:v0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: public
              containerPort: 8088
            - name: internal
              containerPort: 8090
          envFrom:
            - configMapRef:
                name: aiops-config
            - secretRef:
                name: aiops-secrets
          # readiness 指 /readyz:DB 不可用时返 503,kubelet 把本副本摘出
          # Service endpoints,流量转到健康副本。依赖恢复后自动放回。
          readinessProbe:
            httpGet:
              path: /readyz
              port: public
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # liveness 指 /healthz:恒 200、不查依赖。数据库挂了重启进程修不了数据库,
          # 只会让所有副本同时 CrashLoopBackOff 并冲掉最需要的日志。
          livenessProbe:
            httpGet:
              path: /healthz
              port: public
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # control-plane 作为 mTLS 客户端持客户端证书。
            - name: client-tls
              mountPath: /certs
              readOnly: true
      volumes:
        - name: client-tls
          secret:
            secretName: aiops-client-tls
            optional: true
