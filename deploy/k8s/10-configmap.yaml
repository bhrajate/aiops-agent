# 非敏感配置(统一前缀 AIOPS_)。敏感项(DSN/密钥/证书)见 20-secret.example.yaml。
# 依赖的 PostgreSQL / Temporal / Kafka / MinIO 为托管服务或独立 chart,
# 这里仅给出连接占位,按环境替换为真实 Service DNS 或托管端点。
apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-config
  namespace: aiops
  labels:
    app.kubernetes.io/part-of: aiops
data:
  # ---- 网络监听 ----
  AIOPS_PUBLIC_ADDR: ":8088"
  AIOPS_INTERNAL_ADDR: ":8090"
  AIOPS_CLUSTER_AGENT_ADDR: ":9100"

  # ---- 事件总线 / 工作流(占位:替换为托管端点)----
  AIOPS_KAFKA_BROKERS: "kafka-bootstrap.data.svc.cluster.local:9092"
  AIOPS_TEMPORAL_HOSTPORT: "temporal-frontend.temporal.svc.cluster.local:7233"
  AIOPS_TEMPORAL_NAMESPACE: "default"
  AIOPS_TEMPORAL_QUEUE: "investigation-ai"
  AIOPS_TASK_QUEUE: "investigation-ai"

  # ---- 对象存储(证据快照;密钥走 Secret)----
  AIOPS_S3_ENDPOINT: "http://minio.data.svc.cluster.local:9000"
  AIOPS_S3_BUCKET: "aiops-evidence"

  # ---- 组件互联(集群内 Service DNS)----
  AIOPS_CLUSTER_AGENT_URL: "https://cluster-agent.aiops.svc.cluster.local:9100"
  AIOPS_CONTROL_INTERNAL_URL: "http://control-plane-internal.aiops.svc.cluster.local:8090"
  AIOPS_CLUSTER_ID: "prod-cn-1"
  AIOPS_TENANT: "default"

  # ---- 认证(生产用 OIDC;见 SECURITY.md §1)----
  AIOPS_AUTH_MODE: "oidc"
  AIOPS_OIDC_AUDIENCE: "aiops"

  # ---- Model Gateway ----
  AIOPS_MODEL_PROVIDER: "anthropic"
  AIOPS_ANTHROPIC_MODEL: "claude-opus-4-8[1M]"

  # ---- mTLS(Tool Gateway ↔ Cluster Agent;生产必开)----
  AIOPS_AGENT_TLS_ENABLED: "true"
  AIOPS_AGENT_TLS_CERT: "/certs/agent.crt"
  AIOPS_AGENT_TLS_KEY: "/certs/agent.key"
  AIOPS_AGENT_TLS_CLIENT_CA: "/certs/ca.crt"
  AIOPS_AGENT_MTLS_ENABLED: "true"
  AIOPS_AGENT_CLIENT_CERT: "/certs/client.crt"
  AIOPS_AGENT_CLIENT_KEY: "/certs/client.key"
  AIOPS_AGENT_CA: "/certs/ca.crt"

  # ---- 可靠性 ----
  AIOPS_MAX_DELIVERY_ATTEMPTS: "5"

  # ---- 数据保留(retention)----
  # 高写入表若不清理会无界增长(signals / investigation_events / audit_log 最先出问题)。
  # 清理由 janitor 角色分批执行:只删终态数据,活跃 incident 与未结束调查永不触碰。
  # 任一项设为 "0" 即关闭该表的清理。请按合规要求调整 AUDIT_DAYS。
  AIOPS_RETENTION_ENABLED: "true"
  AIOPS_RETENTION_SIGNAL_DAYS: "30"        # 未归属 incident 的原始信号
  AIOPS_RETENTION_EVENT_DAYS: "90"         # 调查时间线事件
  AIOPS_RETENTION_AUDIT_DAYS: "365"        # 审计日志(合规相关,保留最久)
  AIOPS_RETENTION_OUTBOX_DAYS: "7"         # 仅已投递记录;pending/failed 永不删
  AIOPS_RETENTION_DEAD_LETTER_DAYS: "30"
  AIOPS_RETENTION_IDEMPOTENCY_DAYS: "7"
  AIOPS_RETENTION_CASE_DAYS: "180"         # 终态 incident 整案(含证据/假设)
  AIOPS_RETENTION_INTERVAL_SEC: "3600"
  AIOPS_RETENTION_BATCH_SIZE: "5000"

  # ---- 共享可观测性后端(控制面直连;多集群共用一套)----
  # 这些后端不在任何 K8s 集群内,由控制面 Tool Gateway 直接查询
  # (control-plane/internal/obsquery),不再绕经 cluster-agent。
  AIOPS_PROM_URL: "http://prometheus.observability.svc:9090"
  AIOPS_LOKI_URL: "http://loki.observability.svc:3100"
  AIOPS_TEMPO_URL: "http://tempo.observability.svc:3200"
  # 后端中区分集群的 label / tag 名。多集群共用一套后端时**必须**设置,
  # 否则只按 namespace 过滤会读到其他集群的同名 namespace。
  # 常见:cluster / cluster_id / k8s_cluster(Tempo 侧常为 k8s.cluster.name)。
  AIOPS_CLUSTER_LABEL: "cluster"
