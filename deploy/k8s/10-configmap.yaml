# 非敏感配置(统一前缀 AIOPS_)。敏感项(DSN/密钥/证书)见 20-secret.example.yaml。
# 依赖的 PostgreSQL / Temporal / Kafka / MinIO 为托管服务或独立 chart,
# 这里仅给出连接占位,按环境替换为真实 Service DNS 或托管端点。
apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-config
  namespace: aiops
  labels:
    app.kubernetes.io/part-of: aiops
data:
  # ---- 运行环境(生产护栏总开关)----
  # 不只是日志标签:control-plane 的启动校验只在 production/prod 下执行严格分支
  # ——拒绝 auth disabled、默认/过短 HS256 密钥、缺失 internal token 与 webhook
  # secret、mock 观测数据源、未配置观测后端、未配置集群维度隔离。
  # 缺失时代码默认 "development",上述每一条都变成静默放行:本文件下面那些
  # "生产必须配"的注释就全部失去强制力,配错不再 fail-fast 而是带病启动。
  AIOPS_ENV: "production"

  # ---- cluster-agent 的 K8s 只读数据源 ----
  # live(client-go 只读)| mock(确定性假数据)。代码默认 **mock**,所以必须显式给出。
  # mock 会让 get_workload_state / get_kubernetes_events / list_recent_changes /
  # inspect_dependencies 这四个工具返回虚构但自洽的"故障故事",而它们会被冻结成
  # Evidence、拿到 Evidence ID、进入诊断结论 —— evidence-grounding 只校验结论
  # 是否引用了证据,不校验证据是否真实。AIOPS_ENV=production 下 mock 会被拒绝启动。
  AIOPS_DATASOURCE: "live"

  # ---- 网络监听 ----
  AIOPS_PUBLIC_ADDR: ":8088"
  AIOPS_INTERNAL_ADDR: ":8090"
  AIOPS_CLUSTER_AGENT_ADDR: ":9100"

  # ---- 事件总线 / 工作流(占位:替换为托管端点)----
  AIOPS_KAFKA_BROKERS: "kafka-bootstrap.data.svc.cluster.local:9092"
  AIOPS_TEMPORAL_HOSTPORT: "temporal-frontend.temporal.svc.cluster.local:7233"
  AIOPS_TEMPORAL_NAMESPACE: "default"
  AIOPS_TEMPORAL_QUEUE: "investigation-ai"
  AIOPS_TASK_QUEUE: "investigation-ai"
  # 单个 Workflow run 的墙钟硬上限(7 天)。不是调查时长上限 —— 那由 Budget 管。
  # 必须 >= 216000(60h):Worker 最长等待人工反馈 48h,配小了控制面拒绝启动。
  AIOPS_TEMPORAL_RUN_TIMEOUT_SEC: "604800"
  AIOPS_MAX_CONCURRENT_ACTIVITIES: "16"

  # ---- 对象存储(证据快照;密钥走 Secret)----
  AIOPS_S3_ENDPOINT: "http://minio.data.svc.cluster.local:9000"
  AIOPS_S3_BUCKET: "aiops-evidence"

  # ---- 组件互联(集群内 Service DNS)----
  AIOPS_CLUSTER_AGENT_URL: "https://cluster-agent.aiops.svc.cluster.local:9100"
  AIOPS_CONTROL_INTERNAL_URL: "http://control-plane-internal.aiops.svc.cluster.local:8090"
  AIOPS_CLUSTER_ID: "prod-cn-1"
  AIOPS_TENANT: "default"

  # ---- 认证(生产用 OIDC;见 SECURITY.md §1)----
  AIOPS_AUTH_MODE: "oidc"
  AIOPS_OIDC_AUDIENCE: "aiops"

  # ---- Model Gateway ----
  AIOPS_MODEL_PROVIDER: "anthropic"
  AIOPS_ANTHROPIC_MODEL: "claude-opus-4-8[1M]"

  # ---- mTLS(Tool Gateway ↔ Cluster Agent;生产必开)----
  AIOPS_AGENT_TLS_ENABLED: "true"
  AIOPS_AGENT_TLS_CERT: "/certs/agent.crt"
  AIOPS_AGENT_TLS_KEY: "/certs/agent.key"
  AIOPS_AGENT_TLS_CLIENT_CA: "/certs/ca.crt"
  AIOPS_AGENT_MTLS_ENABLED: "true"
  AIOPS_AGENT_CLIENT_CERT: "/certs/client.crt"
  AIOPS_AGENT_CLIENT_KEY: "/certs/client.key"
  AIOPS_AGENT_CA: "/certs/ca.crt"

  # ---- 可靠性 ----
  AIOPS_MAX_DELIVERY_ATTEMPTS: "5"

  # ---- 信号入口限流(抗告警风暴)----
  # 按租户令牌桶,按**信号条数**计费(一个 webhook 可带数百条告警,
  # 按请求计费挡不住风暴)。超限返回 429 + Retry-After。
  # 注意:进程内限流,每副本独立配额 → 集群总容量 = 本值 × 副本数。
  # 设为 "0" 关闭。
  AIOPS_INGRESS_RATE_PER_SEC: "50"
  AIOPS_INGRESS_BURST: "500"

  # ---- 服务依赖拓扑(拓扑关联)----
  # topology_refs 此前恒为 '[]':相关性合并只按 tenant|cluster|namespace,
  # 调用链上的故障传播识别不了(checkout 挂了导致 payment-api 超时,
  # 值班人员看到两个互不相关的 incident,而根因只有一个)。
  #
  # 边来自 Tempo service graph 指标(traces_service_graph_request_total),
  # **需 Tempo 启用 metrics-generator 的 service-graphs 处理器**,
  # 且其指标写入本控制面所连的 Prometheus。未启用时同步查到 0 条边并告警一次,
  # 不影响任何既有路径。
  AIOPS_TOPOLOGY_ENABLED: "true"
  AIOPS_TOPOLOGY_SYNC_SEC: "300"
  AIOPS_TOPOLOGY_MAX_EDGE_AGE_SEC: "3600"   # 超过此龄的边视为已下线,不参与关联
  # 两级置信度:0.5 进 topology_refs(给 planner 更多上下文,错了代价小);
  # 0.8 才能链接 incident(会出现在值班人员界面上,错了会误导排查方向)。
  # K8s Service selector 边只有 0.7 —— 够前者不够后者。
  AIOPS_TOPOLOGY_MIN_CONFIDENCE: "0.5"
  AIOPS_TOPOLOGY_MIN_LINK_CONFIDENCE: "0.8"

  # ---- SLO 燃尽率监视(主动异常检测)----
  # 默认关闭:SLI 定义**必须由部署方给出**(只有你们知道什么算错误请求)。
  # 开启前请把 AIOPS_SLO_DEFINITIONS_PATH 指向挂载的 ConfigMap 文件 ——
  # 表达式含完整 PromQL,塞进环境变量既难读又容易被 shell 转义弄坏。
  #
  # 表达式必须是**比率**(0..1)且含 $WINDOW 占位符(监视器按档位替换成
  # 1h/5m/6h/30m/72h/6h)。缺占位符会让多窗口过滤静默失效,启动时会报错。
  # 档位取自 SRE workbook 表 5-8:14.4×/1h+5m、6×/6h+30m、1×/3d+6h。
  AIOPS_SLO_ENABLED: "false"
  AIOPS_SLO_INTERVAL_SEC: "60"
  # AIOPS_SLO_DEFINITIONS_PATH: "/etc/aiops/slo/slis.json"

  # ---- 自动触发策略(F7)----
  # 此前一律触发:每个 incident 都消耗一次分诊模型调用,含 P4 单信号
  # (磁盘用量到 80% 这类)。按每集群每天数千告警估算是持续的固定成本。
  #
  # 被跳过的 incident **仍然入库、仍在前端可见、仍可人工发起调查**
  # (手动路径不过这道闸门),且会写 trigger_skipped 审计与
  # aiops_trigger_decisions_total 指标 —— 所以"为什么这个故障没有诊断"能回答。
  #
  # 调阈值前先看指标里的 reason 分布:
  #   sum by (reason) (aiops_trigger_decisions_total)
  AIOPS_AUTO_TRIGGER_ALL: "false"              # true 完整回到旧行为(一律触发)
  AIOPS_AUTO_TRIGGER_ALWAYS_SEVERITIES: "P1,P2" # 无条件触发
  # 可被跳过的级别。默认只含 P4:P3 是最常见级别、混着不少真问题,
  # 拦它会显著改变值班预期。要更省可加 "P3"。
  AIOPS_AUTO_TRIGGER_SKIP_SEVERITIES: "P4"
  AIOPS_AUTO_TRIGGER_BURST_SIGNALS: "3"        # 信号数达此值视为突发;0 关闭该判据
  AIOPS_AUTO_TRIGGER_ON_CHANGE: "true"         # 变更关联必触发(最易自动定位的一类根因)

  # ---- 数据保留(retention)----
  # 高写入表若不清理会无界增长(signals / investigation_events / audit_log 最先出问题)。
  # 清理由 janitor 角色分批执行:只删终态数据,活跃 incident 与未结束调查永不触碰。
  # 任一项设为 "0" 即关闭该表的清理。请按合规要求调整 AUDIT_DAYS。
  AIOPS_RETENTION_ENABLED: "true"
  AIOPS_RETENTION_SIGNAL_DAYS: "30"        # 未归属 incident 的原始信号
  AIOPS_RETENTION_EVENT_DAYS: "90"         # 调查时间线事件
  AIOPS_RETENTION_AUDIT_DAYS: "365"        # 审计日志(合规相关,保留最久)
  AIOPS_RETENTION_OUTBOX_DAYS: "7"         # 仅已投递记录;pending/failed 永不删
  AIOPS_RETENTION_DEAD_LETTER_DAYS: "30"
  # 陈旧拓扑边:同步每 5 分钟刷新 last_seen,7 天不刷新说明该依赖确实没了。
  # 取太短会在 Tempo 短暂不可用时误删仍然存在的边。
  AIOPS_RETENTION_TOPOLOGY_DAYS: "7"
  AIOPS_RETENTION_IDEMPOTENCY_DAYS: "7"
  AIOPS_RETENTION_CASE_DAYS: "180"         # 终态 incident 整案(含证据/假设)
  AIOPS_RETENTION_INTERVAL_SEC: "3600"
  AIOPS_RETENTION_BATCH_SIZE: "5000"

  # ---- 共享可观测性后端(控制面直连;多集群共用一套)----
  # 这些后端不在任何 K8s 集群内,由控制面 Tool Gateway 直接查询
  # (control-plane/internal/obsquery),不再绕经 cluster-agent。
  AIOPS_PROM_URL: "http://prometheus.observability.svc:9090"
  AIOPS_LOKI_URL: "http://loki.observability.svc:3100"
  AIOPS_TEMPO_URL: "http://tempo.observability.svc:3200"
  # 后端中区分集群的 label / tag 名。多集群共用一套后端时**必须**设置,
  # 否则只按 namespace 过滤会读到其他集群的同名 namespace。
  # 常见:cluster / cluster_id / k8s_cluster(Tempo 侧常为 k8s.cluster.name)。
  # 集群维度 label 名——**按后端分别配置**,因为三者命名法不同:
  #   Prometheus/Mimir : cluster            (external_labels 注入)
  #   Loki (Alloy)     : cluster            (relabel 注入)
  #   Loki (OTLP 原生) : k8s_cluster_name   (LogQL label 名须符合 Prom 命名法,点号转下划线)
  #   Tempo            : k8s.cluster.name   (OTel 语义约定,原生保留点号)
  # 点号在 PromQL/LogQL 里是**语法错误**,所以单一值无法同时满足三者。
  # AIOPS_CLUSTER_LABEL 作为全局回落值;下面三个专属变量按需覆盖。
  #
  # ⚠ 上线前必须对着真实后端核对这些名字(核对命令见 docs/INTEGRATION.md)。
  #   名字写错不会报错,只会**静默查不到数据**——最难排查的那类故障。
  AIOPS_CLUSTER_LABEL: "cluster"
  AIOPS_PROM_CLUSTER_LABEL: "cluster"
  AIOPS_LOKI_CLUSTER_LABEL: "cluster"
  AIOPS_TEMPO_CLUSTER_LABEL: "k8s.cluster.name"
