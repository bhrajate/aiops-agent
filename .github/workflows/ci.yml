name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']       # 版本 tag 触发镜像发布(推 :<version>)
  pull_request:
    branches: [main, master]

# 取消同一分支/PR 上进行中的旧运行,节省资源。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write   # 供 docker job 推 GHCR(仅默认分支)

env:
  GOPROXY: https://goproxy.cn,direct
  UV_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/

jobs:
  # ---------------------------------------------------------------- Go
  go:
    name: go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [control-plane, cluster-agent]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...

  # ---------------------------------------------------------------- Python
  ai-worker:
    name: ai-worker (python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-worker
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: uv sync (with dev)
        run: uv sync --extra dev
      - name: pytest
        run: uv run pytest -q
      # 对 AI 系统来说,质量门槛是最重要的回归护栏。它此前建好了却没接 CI
      # (run.py 明确写了 "usable in CI"),等于没有护栏。CLI 门槛不过即非零退出。
      #
      # 注意能力边界:当前 golden case 是照着 mock provider 写的,所以这道门
      # 守的是**管线不回归**(证据链、F2 降级、打分逻辑),不是真实模型质量。
      # 接入真实 provider 后它才开始度量模型本身。
      - name: 离线评测质量门槛 (architecture 18.1)
        run: uv run python -m aiops_worker.evaluation.run

  # ---------------------------------------------------------------- Frontend
  frontend:
    name: frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # 单元测试守的是"错了也看起来正常"的那批纯函数:样本不足时显示破折号
      # 而非 0、阶段终态集合与后端不漂移、列表包裹键不漏。这些缺陷不会让
      # 构建失败,只会让界面显示一个看起来合理的错数字。
      - run: npm test
      - run: npm run build

  # ---------------------------------------------------------------- 安全扫描
  security:
    name: dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Go:官方漏洞库,按实际调用路径判定(比单纯比版本号误报少)。
      - uses: actions/setup-go@v5
        with:
          go-version-file: control-plane/go.mod
      - name: govulncheck (go modules)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          for m in control-plane cluster-agent; do
            echo ">> $m"
            (cd "$m" && "$(go env GOPATH)/bin/govulncheck" ./...)
          done

      # 前端:只在 high/critical 上失败。moderate 大多来自构建期传递依赖,
      # 卡在那一档会让 CI 长期红着,反而没人看告警。
      #
      # audit 必须显式指向官方 registry:frontend/.npmrc 把 registry 设为
      # npmmirror(装包加速),而该镜像未实现 /-/npm/v1/security/* 端点,audit
      # 会拿到 404 NOT_IMPLEMENTED 并以 exit 1 失败。装包仍走镜像,只有查漏洞
      # 库这一步回官方源——漏洞数据只来自 registry,不影响 lockfile 解析。
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit (frontend)
        working-directory: frontend
        run: |
          npm ci
          npm audit --registry=https://registry.npmjs.org --audit-level=high

      # Python:pip-audit 查 PyPI 已知漏洞。
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: pip-audit (ai-worker)
        working-directory: ai-worker
        run: |
          uv sync --extra dev
          uv run --with pip-audit pip-audit

  # ---------------------------------------------------------------- 部署产物校验
  deploy-lint:
    name: deploy manifests + helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Helm lint + template
        run: |
          helm lint deploy/helm/aiops
          helm template aiops deploy/helm/aiops -n aiops \
            -f deploy/helm/aiops/values-prod.yaml > /dev/null
          helm template aiops deploy/helm/aiops -n aiops \
            -f deploy/helm/aiops/values-dev.yaml > /dev/null
      - name: kubeconform (raw manifests + rendered chart)
        run: |
          curl -sSL -o /tmp/kc.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kc.tar.gz -C /tmp
          # 跳过对外部 CRD(cert-manager 等)的严格校验。
          /tmp/kubeconform -strict -ignore-missing-schemas -summary \
            deploy/k8s
          helm template aiops deploy/helm/aiops -n aiops \
            -f deploy/helm/aiops/values-prod.yaml \
            | /tmp/kubeconform -strict -ignore-missing-schemas -summary -

      # kubeconform 只看 YAML 结构合不合 schema,看不出"少了一个决定护栏是否生效
      # 的键"。AIOPS_ENV / AIOPS_DATASOURCE 曾长期不在任何清单里:生产校验因此
      # 静默不执行、cluster-agent 静默用 mock 假数据,而清单本身完全合法。
      # 这一步对着渲染结果断言这两项,并把渲染出的环境变量真的喂给二进制跑校验
      # (含反向用例:抽掉必需项必须被拒,以证明护栏不是空转)。
      - uses: actions/setup-go@v5
        with:
          go-version-file: control-plane/go.mod
      - name: 生产护栏必须生效(AIOPS_ENV / AIOPS_DATASOURCE)
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          bash scripts/check-prod-guards.sh

  # ---------------------------------------------------------------- 可选的依赖数据库测试
  db-tests:
    name: control-plane DB tests (postgres)
    runs-on: ubuntu-latest
    # 可选:仅当需要真实 PG 的集成测试存在时启用。默认随主流程跑,失败不阻塞发布可自行调整。
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aiops
          POSTGRES_PASSWORD: aiops
          POSTGRES_DB: aiops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiops -d aiops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AIOPS_DB_DSN: postgres://aiops:aiops@localhost:5432/aiops?sslmode=disable
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: control-plane/go.mod
          cache-dependency-path: control-plane/go.sum
      - name: Migrate schema
        # 走与生产**同一条**路径(control-plane migrate up),而不是直接灌 SQL:
        # 这样 CI 同时验证迁移器本身、迁移文件的 up 顺序与版本表,而不只是终态 schema。
        # 失败即让 job 失败(不 || true 掩盖),否则集成测试会误跑在坏库上。
        env:
          AIOPS_DB_DSN: postgres://aiops:aiops@localhost:5432/aiops?sslmode=disable
        run: go run ./cmd/control-plane migrate up
      - name: Load dev seed
        # 种子已加幂等守卫(依赖 000005 的自然键唯一索引),重复执行不产生重复行。
        run: |
          for f in ../shared/seed/*.sql; do
            echo ">> seeding $f";
            PGPASSWORD=aiops psql -h localhost -U aiops -d aiops -f "$f";
          done
      - name: go test (DB + integration)
        # 显式跑 DB/集成用例(依赖上面的 Postgres service);失败即失败,不回退掩盖。
        run: go test -count=1 ./... -run 'DB|Integration'

  # ---------------------------------------------------------------- Docker 镜像
  docker:
    name: docker build (${{ matrix.component }})
    runs-on: ubuntu-latest
    needs: [go, ai-worker, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: control-plane
            context: control-plane
            dockerfile: control-plane/Dockerfile
          - component: cluster-agent
            context: cluster-agent
            dockerfile: cluster-agent/Dockerfile
          - component: ai-worker
            context: ai-worker
            dockerfile: ai-worker/Dockerfile
          - component: frontend
            context: .
            dockerfile: deploy/docker/frontend.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # 推送策略:默认分支推 :sha 与 :edge;版本 tag(v*)推 :<version>,
      # 与 K8s 清单/Helm 使用的固定版本 tag 对齐(修复发布链断裂)。PR 只构建不推。
      - name: Set push flags
        id: flags
        run: |
          push=false; tags=""
          repo="ghcr.io/${{ github.repository_owner }}/${{ matrix.component }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            case "${{ github.ref }}" in
              refs/heads/main|refs/heads/master)
                push=true
                tags="$repo:${{ github.sha }},$repo:edge" ;;
              refs/tags/v*)
                push=true
                ver="${GITHUB_REF#refs/tags/}"
                tags="$repo:${ver},$repo:${{ github.sha }}" ;;
            esac
          fi
          echo "push=$push" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        if: steps.flags.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on default branch / version tag)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ steps.flags.outputs.push }}
          tags: ${{ steps.flags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
