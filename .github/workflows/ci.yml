name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# 取消同一分支/PR 上进行中的旧运行,节省资源。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write   # 供 docker job 推 GHCR(仅默认分支)

env:
  GOPROXY: https://goproxy.cn,direct
  UV_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/

jobs:
  # ---------------------------------------------------------------- Go
  go:
    name: go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [control-plane, cluster-agent]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...

  # ---------------------------------------------------------------- Python
  ai-worker:
    name: ai-worker (python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-worker
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: uv sync (with dev)
        run: uv sync --extra dev
      - name: pytest
        run: uv run pytest -q

  # ---------------------------------------------------------------- Frontend
  frontend:
    name: frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # ---------------------------------------------------------------- Deploy artifacts lint
  deploy-lint:
    name: deploy manifests + helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Helm lint + template
        run: |
          helm lint deploy/helm/aiops
          helm template aiops deploy/helm/aiops -n aiops \
            -f deploy/helm/aiops/values-prod.yaml > /dev/null
          helm template aiops deploy/helm/aiops -n aiops \
            -f deploy/helm/aiops/values-dev.yaml > /dev/null
      - name: kubeconform (raw manifests + rendered chart)
        run: |
          curl -sSL -o /tmp/kc.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kc.tar.gz -C /tmp
          # 跳过对外部 CRD(cert-manager 等)的严格校验。
          /tmp/kubeconform -strict -ignore-missing-schemas -summary \
            deploy/k8s
          helm template aiops deploy/helm/aiops -n aiops \
            -f deploy/helm/aiops/values-prod.yaml \
            | /tmp/kubeconform -strict -ignore-missing-schemas -summary -

  # ---------------------------------------------------------------- Optional DB-backed tests
  db-tests:
    name: control-plane DB tests (postgres)
    runs-on: ubuntu-latest
    # 可选:仅当需要真实 PG 的集成测试存在时启用。默认随主流程跑,失败不阻塞发布可自行调整。
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aiops
          POSTGRES_PASSWORD: aiops
          POSTGRES_DB: aiops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiops -d aiops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AIOPS_DB_DSN: postgres://aiops:aiops@localhost:5432/aiops?sslmode=disable
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: control-plane/go.mod
          cache-dependency-path: control-plane/go.sum
      - name: Load schema
        run: |
          for f in ../shared/sql/*.sql; do
            echo ">> applying $f";
            PGPASSWORD=aiops psql -h localhost -U aiops -d aiops -f "$f" || true;
          done
      - name: go test (DB-tagged)
        # 若项目用 build tag 隔离集成测试(如 //go:build integration),在此启用。
        run: go test -count=1 ./... -run 'DB|Integration' || go test -count=1 ./...

  # ---------------------------------------------------------------- Docker images
  docker:
    name: docker build (${{ matrix.component }})
    runs-on: ubuntu-latest
    needs: [go, ai-worker, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: control-plane
            context: control-plane
            dockerfile: control-plane/Dockerfile
          - component: cluster-agent
            context: cluster-agent
            dockerfile: cluster-agent/Dockerfile
          - component: ai-worker
            context: ai-worker
            dockerfile: ai-worker/Dockerfile
          - component: frontend
            context: .
            dockerfile: deploy/docker/frontend.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # 仅默认分支登录并推送到 GHCR;PR 只构建不推送。
      - name: Set push flag
        id: flags
        run: |
          if [ "${{ github.event_name }}" = "push" ] && \
             { [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref }}" = "refs/heads/master" ]; }; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Login to GHCR
        if: steps.flags.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on default branch)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ steps.flags.outputs.push }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
